# Build ka9q-radio the way a developer would on each supported platform:
# install the documented prerequisites, run `make`, run `make install`, then
# check that the platform's own init-system integration actually landed.
#
# Manual trigger only -- these jobs install system packages and then install
# into the runner's /usr/local, so they are deliberately not wired to push.
#
# Every job follows the same shape -- deps -> configuration -> make -> install
# -> verify -- which is what makes the comparison across platforms meaningful.
#
# FreeBSD has no hosted runner, so it builds inside a QEMU VM on an Ubuntu host.
# OpenBSD is the remaining target and would follow identically via
# vmactions/openbsd-vm.

name: portable build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu 24.04 / systemd
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Add KA9Q apt repository
        # libfobos-dev and libhydrasdr-dev are not in the stock Ubuntu archive;
        # docs/INSTALL.md sends developers to KA9Q's repository for them. The
        # signing key ships in this tree, so only the suite line is generated --
        # ka9q-sources.list defaults to Debian trixie, and this runner is noble.
        run: |
          set -euo pipefail
          sed -n '/BEGIN PGP PUBLIC KEY BLOCK/,$p' ka9q-radio.asc \
            | sudo tee /usr/share/keyrings/ka9q-radio.asc > /dev/null
          echo 'deb [signed-by=/usr/share/keyrings/ka9q-radio.asc arch=amd64] http://www.ka9q.net/debian noble main' \
            | sudo tee /etc/apt/sources.list.d/ka9q-sources.list > /dev/null
          sudo apt-get update

      - name: Install build dependencies
        # The package list from docs/INSTALL.md, less git (already present).
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            avahi-utils build-essential make gcc \
            libairspy-dev libairspyhf-dev libavahi-client-dev libbladerf-dev \
            libbsd-dev libfftw3-dev libfobos-dev libhackrf-dev libhydrasdr-dev \
            libiniparser-dev libliquid-dev libncurses5-dev libncursesw5-dev \
            libogg-dev libopus-dev librtlsdr-dev libsamplerate-dev \
            libusb-1.0-0-dev libusb-dev portaudio19-dev libasound2-dev \
            uuid-dev rsync

      - name: Show build configuration
        # -q so printing the variable database does not also run the default
        # goal; it exits non-zero whenever targets are out of date, hence || true.
        run: |
          make -qp 2>/dev/null | grep -E '^(INIT_SYSTEM|INIT_SUBDIRS) =' || true
          uname -a
          cc --version | head -1

      - name: make
        run: make -j"$(nproc)"

      - name: make install
        # No DESTDIR, exactly as a developer runs it. The user/group creation in
        # the top-level install target is guarded by `[ -z "$(DESTDIR)" ]`, so a
        # staged install would skip it entirely -- this is the only way to
        # exercise that path.
        run: sudo make install

      - name: Verify install
        run: |
          set -euo pipefail
          echo "--- binaries ---"
          test -x /usr/local/sbin/radiod
          test -x /usr/local/bin/control
          test -x /usr/local/bin/monitor
          echo "ok"

          echo "--- systemd units ---"
          ls -l /etc/systemd/system/radiod@.service
          test -d /usr/local/lib/ka9q-radio

          echo "--- radio user and group ---"
          getent group radio
          getent passwd radio

  macos:
    name: macOS 15 / launchd
    runs-on: macos-15
    # Drivers unavailable through MacPorts: fobos and hydrasdr have no port at
    # all, and bladeRF's port forces a tecla dependency that has no prebuilt
    # archive and fails to build on the runner (see the parameters file).
    # Everything else keeps its default from the top-level Makefile. Both make
    # invocations must agree, since `install` depends on `all`.
    env:
      ENABLE_FLAGS: ENABLE_FOBOS=0 ENABLE_HYDRASDR=0 ENABLE_BLADERF=0
    steps:
      - uses: actions/checkout@v4

      - name: Install MacPorts and build dependencies
        # Pinned to the v1.1.6 commit rather than a floating tag: this is a
        # low-traffic third-party action running with repository checkout access.
        uses: melusina-org/setup-macports@103eded5f10979e927bffcd6d0b86cbbdb2c3bb3
        with:
          parameters: .github/parameters/setup-macports.yaml

      - name: Show build configuration
        run: |
          port version
          make -qp ${{ env.ENABLE_FLAGS }} 2>/dev/null | grep -E '^(INIT_SYSTEM|INIT_SUBDIRS) =' || true
          uname -a
          cc --version | head -1

      - name: make
        run: make -j"$(sysctl -n hw.ncpu)" ${{ env.ENABLE_FLAGS }}

      - name: make install
        run: sudo make install ${{ env.ENABLE_FLAGS }}

      - name: Verify install
        run: |
          set -euo pipefail
          echo "--- binaries ---"
          test -x /usr/local/sbin/radiod
          test -x /usr/local/bin/control
          test -x /usr/local/bin/monitor
          echo "ok"

          echo "--- launchd template ---"
          ls -l /usr/local/share/ka9q-radio/launchd/net.ka9q.radiod.plist
          plutil -lint /usr/local/share/ka9q-radio/launchd/net.ka9q.radiod.plist

          echo "--- radio user and group ---"
          # Expected to FAIL today: the top-level install target creates the
          # radio user and group with getent/addgroup/adduser, which are
          # Debian-only. The launchd plist references this account, so the
          # gap is real rather than cosmetic. See docs/PORTABLE-INIT.md.
          dscl . -list /Groups | grep -qx radio
          dscl . -list /Users | grep -qx radio

  freebsd:
    name: FreeBSD 14.2 / rc.d
    # No hosted FreeBSD runner exists; the build happens inside a QEMU VM
    # started on an Ubuntu host by the action below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and install in a FreeBSD VM
        # Pinned to the v1.5.2 commit rather than a floating tag: this is a
        # third-party action running with repository checkout access.
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d
        with:
          release: '14.2'
          usesh: true
          # Nothing needs to come back to the host; skipping the sync back
          # saves the whole return trip.
          copyback: false
          # Every driver library ka9q uses is in the FreeBSD ports tree, but
          # comms/libfobos is 2.3.2, whose fobos_rx_close() takes a second
          # do_reset argument. ka9q's fobos.c is written against the older
          # one-argument API that Ubuntu gets from KA9Q's own repository, so
          # fobos is disabled here until that divergence is resolved. See
          # TODO.md. libusb is in the FreeBSD base system, not a package.
          # Note bladeRF's capitalization: the port lives in comms/bladerf but
          # sets PORTNAME=bladeRF, so that is the package name. Every other
          # package here matches its port directory.
          # git is needed by src/Makefile's config_paths.h rule, which embeds
          # git describe output; without it the build emits "git: not found"
          # and bakes in an empty version string.
          prepare: |
            pkg install -y git gmake pkgconf fftw3-float iniparser opus libogg \
              portaudio libsamplerate airspy airspyhf hackrf rtl-sdr \
              hydrasdr libfobos bladeRF
          # This block runs as root inside the VM, so no sudo.
          run: |
            set -e
            ENABLE_FLAGS="ENABLE_FOBOS=0"

            # The workspace is owned by the host's runner user but this block
            # executes as root, so git refuses it as "dubious ownership" and
            # every git call in src/Makefile's config_paths.h rule fails. That
            # is not fatal -- it just bakes empty GIT_HASH, GIT_VERSION and
            # friends into the binary -- so it has to be caught deliberately.
            git config --global --add safe.directory "$(pwd)"

            echo "--- build configuration ---"
            uname -a
            cc --version | head -1
            # FreeBSD's make(1) is BSD make and cannot parse these GNU
            # Makefiles (ifeq, pattern rules, $(shell ...)); gmake is required
            # throughout, including for the recursive sub-makes.
            gmake -qp 2>/dev/null | grep -E '^(INIT_SYSTEM|INIT_SUBDIRS) =' || true

            echo "--- make ---"
            gmake -j"$(sysctl -n hw.ncpu)" $ENABLE_FLAGS

            echo "--- version metadata ---"
            grep -E 'GIT_(HASH|VERSION)' src/config_paths.h
            # An empty GIT_VERSION means the git calls above silently failed.
            grep -qE '^#define GIT_VERSION "..*"' src/config_paths.h

            echo "--- make install ---"
            gmake install $ENABLE_FLAGS

            echo "--- binaries ---"
            test -x /usr/local/sbin/radiod
            test -x /usr/local/bin/control
            test -x /usr/local/bin/monitor
            echo "ok"

            echo "--- rc.d script ---"
            ls -l /usr/local/etc/rc.d/radiod
            test -x /usr/local/etc/rc.d/radiod
            sh -n /usr/local/etc/rc.d/radiod

            echo "--- radio user and group ---"
            pw groupshow radio
            pw usershow radio
